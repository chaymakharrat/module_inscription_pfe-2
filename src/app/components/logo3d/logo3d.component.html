<div class="error-shell">

    <!-- Fond ambiant -->
    <div class="ambient-bg">
        <div class="ambient-orb orb-error-1"></div>
        <div class="ambient-orb orb-error-2"></div>
    </div>

    <!-- Logo 3D -->
    <div class="error-logo-zone">
        <canvas #logoCanvas class="logo-canvas"></canvas>
    </div>

    <!-- Carte info -->
    <div class="error-bottom-card">
        <div class="error-bottom-inner">

            <div class="error-bottom-text">
                <div class="error-badge">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path
                            d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />
                        <line x1="12" y1="9" x2="12" y2="13" />
                        <line x1="12" y1="17" x2="12.01" y2="17" />
                    </svg>
                    Lien Expiré
                </div>
                <h1 class="error-title">{{ title }}</h1>
                <p class="error-sub" [innerHTML]="subtitle"></p>
            </div>

            <div class="error-divider"></div>

            <div class="error-actions">
                <a href="/" class="error-btn-primary">
                    <svg viewBox="0 0 20 20" fill="currentColor">
                        <path
                            d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 9.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1V9.414l1.293 1.293a1 1 0 001.414-1.414l-7-7z" />
                    </svg>
                    Aller à l'accueil
                </a>
                <a [href]="'mailto:' + contactEmail" class="error-btn-secondary">
                    <svg viewBox="0 0 20 20" fill="currentColor">
                        <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z" />
                        <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z" />
                    </svg>
                    {{ contactLabel }}
                </a>
            </div>

        </div>
    </div>
</div>
